services:
  discord-dj:
    build: .
    container_name: discord-dj-bot-dev
    restart: unless-stopped
    env_file:
      - .env
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    working_dir: /app
    environment:
      - NODE_ENV=development
    command: ["npm", "run", "dev"]
    # Add resource limits
    develop:
      watch:
        - path: ./src
          action: sync
          target: /app/src
          ignore:
            - node_modules
            - dist
            - .git
        - path: ./package.json
          action: rebuild
          target: /app/package.json
        - path: ./.env
          action: rebuild
          target: /app/.env
